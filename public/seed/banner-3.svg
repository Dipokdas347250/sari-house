<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="ব্যানার">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c2a52"/>
      <stop offset="100%" stop-color="#4d3768"/>
    </linearGradient>
    
    <pattern id="motif" width="100" height="100" patternUnits="userSpaceOnUse">
      <g opacity="0.7">
        <g transform="translate(50 50)">
          <ellipse cx="0" cy="-16" rx="7" ry="14" fill="#d9b6e0" opacity="0.55" transform="rotate(0)"/><ellipse cx="0" cy="-16" rx="7" ry="14" fill="#d9b6e0" opacity="0.55" transform="rotate(60)"/><ellipse cx="0" cy="-16" rx="7" ry="14" fill="#d9b6e0" opacity="0.55" transform="rotate(120)"/><ellipse cx="0" cy="-16" rx="7" ry="14" fill="#d9b6e0" opacity="0.55" transform="rotate(180)"/><ellipse cx="0" cy="-16" rx="7" ry="14" fill="#d9b6e0" opacity="0.55" transform="rotate(240)"/><ellipse cx="0" cy="-16" rx="7" ry="14" fill="#d9b6e0" opacity="0.55" transform="rotate(300)"/>
          <circle r="5" fill="#e2b238" opacity="0.8"/>
        </g>
        <circle cx="0" cy="0" r="3" fill="#d9b6e0" opacity="0.4"/>
        <circle cx="100" cy="100" r="3" fill="#d9b6e0" opacity="0.4"/>
      </g>
    </pattern>
    <radialGradient id="vig" cx="0.35" cy="0.4" r="0.85">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#motif)" opacity="0.85"/>
  <rect x="0" y="810" width="1600" height="90" fill="#e2b238" opacity="0.9"/>
  <rect x="0" y="802" width="1600" height="8" fill="#d9b6e0" opacity="0.8"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
